# .github/workflows/terraform.yml
name: Terraform & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Format Check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - run: terraform fmt -check -recursive

      - name: Trivy IaC Scan (Static Analysis)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"

  verify-hardening:
    needs: lint-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 1. Prepare the SSHkey (independent of IP)
      - name: Configure SSH key for GitHub Actions
        run: |
          mkdir -p ~/.ssh
          cat <<EOF > ~/.ssh/id_github_actions
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_github_actions

      - name: Get VM IP and Run Security Tests
        run: |
          # 1. Fetch IP (the value is stored in the GitHub runner's memory)
          VM_IP=$(gcloud compute instances describe "lars-torngren-lab1-vm" \
            --zone="europe-west1-b" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')

          echo "Ansluter till VM på IP: $VM_IP"

          # 2. Run the tests (we use 'EOF' with quotes to not expand variables locally)
          ssh -i ~/.ssh/id_github_actions -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$VM_IP << 'EOF'
            set -e
            echo "--- Verifierar SSH-härdning ---"
            grep -q "^MaxAuthTries 3" /etc/ssh/sshd_config && echo "✅ SSH OK"
            
            echo "--- Verifierar System-härdning ---"
            grep -q "umask 027" /etc/profile && echo "✅ Umask OK"
            [ -f /etc/fail2ban/jail.local ] && echo "✅ Fail2ban OK"
            
            echo "--- Kontrollerar Lynis ---"
            echo "⏳ Väntar på att startup-skriptet och Lynis ska bli klara..."
            
            # Vänta max 5 minuter (30 försök * 10 sekunder)
            for i in {1..30}; do
              if [ -f /var/log/lynis-report.txt ]; then
                echo "✅ Lynis-rapport hittad efter $i försök!"
                # Vänta 5 sekunder extra så att filen hinner skrivas klart
                sleep 5
                break
              fi
              echo "Väntar på rapport... ($i/30)"
              sleep 10
            done

            if [ ! -f /var/log/lynis-report.txt ]; then
              echo "❌ TIMEOUT: Lynis-rapporten skapades aldrig. Kontrollera journalctl -u google-startup-scripts.service på VM:en."
              exit 1
            fi

            echo "--- Verifierar resultat ---"
            grep -i "Hardening index" /var/log/lynis-report.txt

            #if [ -f /var/log/lynis-report.txt ]; then
              # Lynis skriver poängen i formatet "Hardening index : 65"
              # Vi använder -i för att strunta i stora/små bokstäver
            #  grep -i "Hardening index" /var/log/lynis-report.txt || echo "Kunde inte hitta index i filen."
            #else
            #  echo "❌ Hittade ingen rapport på /var/log/lynis-report.txt"
            #  exit 1
            #fi
            
            # Write out the score so it shows up in the log directly
            #grep "Hardening index" /var/log/lynis-report.txt || echo "Hardening index: 0"
          EOF

          # 3. Fetch report (IMPORTANT: Here $VM_IP has to be outside of 'EOF')
          scp -i ~/.ssh/id_github_actions -o StrictHostKeyChecking=no ubuntu@$VM_IP:/var/log/lynis-report.txt ./lynis-report.txt

      - name: Extract and Display Hardening Score
        run: |
          # Extract the score from the report
          # Lynis often save this as "hardening_index=XX" in the log/report, so we can grep for it
          #SCORE=$(grep "Hardening index" lynis-report.txt | cut -d':' -f2 | xargs || echo "0")
          # Remove all colors and special characters to get a clean number
          RAW_SCORE=$(grep "Hardening index" lynis-report.txt | cut -d':' -f2)
          CLEAN_SCORE=$(echo "$RAW_SCORE" | tr -dc '0-9')

          echo "==========================================="
          echo "🛡️ DIN LYNIS HARDENING SCORE: $SCORE"
          echo "==========================================="

          # Save the number other steps can use it
          echo "HARDENING_SCORE=$CLEAN_SCORE" >> $GITHUB_ENV

          # Put in a requirement: If score is under 60, mark as failed
          if [ "$SCORE" -lt 65 ]; then
            echo "❌ Säkerhetspoängen ($SCORE) är för låg. Fortsätt härda systemet!"
            exit 1
          fi

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynis-report-${{ github.run_id }}
          path: lynis-report.txt

  terraform-plan:
    needs: verify-hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
      - run: terraform init
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=chas-devsecops-2026" \
            -var="region=europe-west1" \
            -var="ssh_pub_key=${{ secrets.SSH_PUB_KEY }}" \
            -var="student_id=lars-torngren"

