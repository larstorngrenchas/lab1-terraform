# .github/workflows/terraform.yml
name: Terraform & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Format Check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - run: terraform fmt -check -recursive

      - name: Trivy IaC Scan (Static Analysis)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"

  verify-hardening:
    needs: lint-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get VM IP and Run SSH Tests
        run: |
          # Skapa en lokal variabel i bash för att undvika problem med citattecken
          STUDENT_ID="${{ secrets.STUDENT_ID }}"
          VM_NAME="${STUDENT_ID}-lab1-vm"

          echo "Söker efter VM: $VM_NAME"

          # Hämta IP dynamiskt via gcloud med tydliga citattecken
          VM_IP=$(gcloud compute instances describe "$VM_NAME" \
            --zone="europe-north1-b" \
            --format='get(networkInterfaces.accessConfigs.natIP)')

          echo "Ansluter till VM: $VM_IP"

          # 2. Konfigurera SSH-nyckel
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 3. Verifiera inställningar inuti VM:en
          ssh -o StrictHostKeyChecking=no ubuntu@$VM_IP << 'EOF'
            set -e
            echo "--- Verifierar SSH-härdning ---"
            grep -q "^MaxAuthTries 3" /etc/ssh/sshd_config
            grep -q "^X11Forwarding no" /etc/ssh/sshd_config
            
            echo "--- Verifierar System-härdning ---"
            grep -q "umask 027" /etc/profile
            [ -f /etc/fail2ban/jail.local ]
            
            echo "--- Kontrollerar Lynis ---"
            [ -f /var/log/lynis-report.txt ]
            echo "✅ All manuell verifiering OK!"
          EOF

          # 4. Hämta Lynis-rapporten
          scp -o StrictHostKeyChecking=no ubuntu@$VM_IP:/var/log/lynis-report.txt ./lynis-report.txt

      - name: Extract and Display Hardening Score
        run: |
          # Extrahera poängen från rapporten
          # Lynis sparar ofta detta som "hardening_index=XX" i sin logg/rapport
          SCORE=$(grep "Hardening index" lynis-report.txt | cut -d':' -f2 | xargs || echo "0")

          echo "==========================================="
          echo "🛡️ DIN LYNIS HARDENING SCORE: $SCORE"
          echo "==========================================="

          # Sätt ett krav: Om poängen är under 60, markera som misslyckad
          if [ "$SCORE" -lt 60 ]; then
            echo "❌ Poängen ($SCORE) är för låg. Fortsätt härda systemet!"
            exit 1
          fi

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynis-report-${{ github.run_id }}
          path: lynis-report.txt

  terraform-plan:
    needs: verify-hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
      - run: terraform init
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=chas-devsecops-2026" \
            -var="region=europe-north1" \
            -var="student_id=${{ secrets.STUDENT_ID }}"

