# .github/workflows/terraform.yml
name: Terraform & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Format Check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - run: terraform fmt -check -recursive

      - name: Trivy IaC Scan (Static Analysis)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"

  verify-hardening:
    needs: lint-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 1. Prepare the SSHkey (independent of IP)
      - name: Configure SSH key for GitHub Actions
        run: |
          mkdir -p ~/.ssh
          cat <<EOF > ~/.ssh/id_github_actions
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_github_actions

      - name: Get VM IP and Run SSH Tests
        run: |
          # Create a local variable in bash to avoid problems with quotes
          STUDENT_ID="${{ secrets.STUDENT_ID }}"
          VM_NAME="lars-torngren-lab1-vm"

          echo "Söker efter VM: $VM_NAME"

          # Fetch IP dynamically via gcloud with clear quotes
          VM_IP=$(gcloud compute instances describe "$VM_NAME" \
            --zone="europe-west1-b" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')

          echo "Ansluter till VM: $VM_IP som ubuntu med SSH-nyckel"

          # Using the key we just created, connect to the VM and run the hardening verification commands
          ssh -i ~/.ssh/id_github_actions -o StrictHostKeyChecking=no ubuntu@$VM_IP << 'EOF'
            echo "✅ Inloggad! Kör tester..."

          # Verify settings inside the VM
          ssh -o StrictHostKeyChecking=no ubuntu@$VM_IP << 'EOF'
            set -e
            echo "--- Verifierar SSH-härdning ---"
            grep -q "^MaxAuthTries 3" /etc/ssh/sshd_config
            grep -q "^X11Forwarding no" /etc/ssh/sshd_config
            
            echo "--- Verifierar System-härdning ---"
            grep -q "umask 027" /etc/profile
            [ -f /etc/fail2ban/jail.local ]
            
            echo "--- Kontrollerar Lynis ---"
            [ -f /var/log/lynis-report.txt ]
            echo "✅ All manuell verifiering OK!"

            # Show the score directly in the terminal for safety
            grep "Hardening index" /var/log/lynis-report.txt
          EOF

          # Fetch the Lynis report
          scp -i ~/.ssh/id_github_actions -o StrictHostKeyChecking=no ubuntu@$VM_IP:/var/log/lynis-report.txt ./lynis-report.txt

      - name: Extract and Display Hardening Score
        run: |
          # Extract the score from the report
          # Lynis often save this as "hardening_index=XX" in the log/report, so we can grep for it
          SCORE=$(grep "Hardening index" lynis-report.txt | cut -d':' -f2 | xargs || echo "0")

          echo "==========================================="
          echo "🛡️ DIN LYNIS HARDENING SCORE: $SCORE"
          echo "==========================================="

          # Put in a requirement: If score is under 60, mark as failed
          if [ "$SCORE" -lt 60 ]; then
            echo "❌ Poängen ($SCORE) är för låg. Fortsätt härda systemet!"
            exit 1
          fi

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynis-report-${{ github.run_id }}
          path: lynis-report.txt

  terraform-plan:
    needs: verify-hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
      - run: terraform init
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=chas-devsecops-2026" \
            -var="region=europe-north1" \
            -var="student_id=lars-torngren"

