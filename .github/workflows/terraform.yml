# .github/workflows/terraform.yml
name: Terraform & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Format Check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - run: terraform fmt -check -recursive

      - name: Trivy IaC Scan (Static Analysis)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
      - run: trivy config --severity CRITICAL --exit-code 1 .

  verify-hardening:
    needs: lint-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 1. Prepare the SSHkey (independent of IP)
      - name: Configure SSH key for GitHub Actions
        run: |
          mkdir -p ~/.ssh
          cat <<EOF > ~/.ssh/id_github_actions
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_github_actions

      - name: Get VM IP and Run Security Tests
        run: |
          # 1. Fetch IP (the value is stored in the GitHub runner's memory)
          VM_IP=$(gcloud compute instances describe "lars-torngren-lab1-vm" \
            --zone="europe-west1-b" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')

          echo "Ansluter till VM på IP: $VM_IP"

          # 2. Run the tests (we use 'EOF' with quotes to not expand variables locally)
          ssh -i ~/.ssh/id_github_actions -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$VM_IP << 'EOF'
            #set -e
            echo "--- Verifierar SSH-härdning ---"
            grep -q "^MaxAuthTries 3" /etc/ssh/sshd_config && echo "✅ SSH OK"
            
            echo "--- Verifierar System-härdning ---"
            grep -q "umask 027" /etc/profile && echo "✅ Umask OK"
            [ -f /etc/fail2ban/jail.local ] && echo "✅ Fail2ban OK"
            
            echo "--- Kontrollerar Lynis ---"
            echo "⏳ Väntar på att Lynis-skanningen ska slutföras helt..."
            
            # Vänta max 10 minuter (60 försök * 10 sekunder)
            for i in {1..60}; do
              # Vi letar specifikt efter "Hardening index" inuti filen
              if grep -q "Hardening index" /var/log/lynis-report.txt 2>/dev/null; then
                echo "✅ Lynis har skrivit klart rapporten efter $i försök!"
                break
              fi
              echo "Väntar på att index ska genereras... ($i/60)"
              sleep 10
            done

            if ! grep -q "Hardening index" /var/log/lynis-report.txt; then
              echo "❌ TIMEOUT: Lynis hann inte skriva klart indexet."
              exit 1
            fi
            
            # Nu kan vi säkert läsa raden
            SCORE_LINE=$(strings /var/log/lynis-report.txt | grep "Hardening index")
            echo "Resultat: $SCORE_LINE"

            echo "🔍 Verifierar Auditd-status (ACCT-9628)..."
            # Kontrollera att tjänsten körs
            systemctl is-active --quiet auditd && echo "✅ Auditd tjänst körs" || (echo "❌ Auditd körs inte" && exit 1)

            # Kontrollera att våra specifika regler är laddade i kärnan
            sudo auditctl -l | grep -q "passwd_changes" && echo "✅ Audit-regler för /etc/passwd laddade" || (echo "❌ Audit-regler saknas" && exit 1)
            sudo auditctl -l | grep -q "shadow_changes" && echo "✅ Audit-regler för /etc/shadow laddade" || (echo "❌ Audit-regler saknas" && exit 1)

            echo "🔍 Verifierar inaktiverade USB-drivers (USB-1000)..."
            # Vi kollar om usb-storage går att ladda (det ska returnera fel om vår blacklist fungerar)
            modprobe -n -v usb-storage 2>&1 | grep -q "install /bin/true" && echo "✅ USB-storage inaktiverat" || echo "⚠️ USB-storage kan fortfarande laddas"

          EOF

          # 3. Fetch report (IMPORTANT: Here $VM_IP has to be outside of 'EOF')
          scp -i ~/.ssh/id_github_actions -o StrictHostKeyChecking=no ubuntu@$VM_IP:/var/log/lynis-report.txt ./lynis-report.txt

      - name: Extract and Display Hardening Score
        run: |
          # 1. Hämta raden, tvätta bort färger/skräp och behåll bara siffror
          # Vi använder 'tr -dc 0-9' för att vara helt säkra på att få en ren siffra
          CLEAN_SCORE=$(grep "Hardening index" lynis-report.txt | cut -d':' -f2 | tr -dc '0-9')

          # 2. Kontrollera att vi faktiskt fick en siffra, annars sätt till 0
          if [ -z "$CLEAN_SCORE" ]; then CLEAN_SCORE=0; fi

          echo "==========================================="
          echo "🛡️ DIN LYNIS HARDENING SCORE: $CLEAN_SCORE"
          echo "==========================================="

          # 3. Spara siffran i miljövariabeln för framtida bruk
          echo "HARDENING_SCORE=$CLEAN_SCORE" >> $GITHUB_ENV

          # 4. Krav: Om poängen är under 70, markera som misslyckad
          if [ "$CLEAN_SCORE" -lt 70 ]; then
            echo "❌ Säkerhetspoängen ($CLEAN_SCORE) är under målet på 70. Fortsätt härda!"
            exit 1
          fi

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynis-report-${{ github.run_id }}
          path: lynis-report.txt

  terraform-plan:
    needs: verify-hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
      - run: terraform init
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=chas-devsecops-2026" \
            -var="region=europe-west1" \
            -var="ssh_pub_key=${{ secrets.SSH_PUB_KEY }}" \
            -var="student_id=lars-torngren"

